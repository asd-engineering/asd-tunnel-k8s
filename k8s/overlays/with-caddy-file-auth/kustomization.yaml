# Caddy TLS sidecar + file-based SSH authentication.
# Combines HTTPS termination (Caddy on NodePort 30443) with SSH key auth.
# The demo keypair is auto-generated by `asd run quickstart-full` via
# scripts/generate-demo-key.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../file-auth
  - caddy-configmap.yaml
  - service-caddy.yaml

patches:
  - path: patch-caddy-sidecar.yaml
  - path: patch-networkpolicy.yaml
