apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherits from file-auth (3 replicas, NATS, SSH key auth)
resources:
  - ../file-auth

# Override images with internal registry references.
# Replace REGISTRY.INTERNAL with your air-gapped registry hostname.
images:
  - name: asd-tunnel
    newName: REGISTRY.INTERNAL/asd-tunnel
    # Pin to SHA256 digest for supply chain verification:
    # digest: sha256:abc123...
    newTag: latest
  - name: validation-server
    newName: REGISTRY.INTERNAL/validation-server
    newTag: latest
  - name: key-validator
    newName: REGISTRY.INTERNAL/key-validator
    newTag: latest

patches:
  - path: patch-airgap.yaml
