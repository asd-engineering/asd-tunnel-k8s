# ConfigMap holding authorized SSH public keys.
# Add your own .pub files to ssh-keys/ and regenerate this ConfigMap,
# or use: kubectl create configmap tunnel-pubkeys --from-file=ssh-keys/ -n asd-tunnel-demo
apiVersion: v1
kind: ConfigMap
metadata:
  name: tunnel-pubkeys
  namespace: asd-tunnel-demo
data:
  demo.pub: |
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM8b9ZoU2u0a+ZHrR9TYQ/9sJRY2p3XKvuAUnjl6QbZQ demo@asd-tunnel-k8s
