apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-server
  namespace: asd-tunnel-demo
  labels:
    app: validation-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-server
  template:
    metadata:
      labels:
        app: validation-server
    spec:
      serviceAccountName: validation-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validation-server
          image: validation-server:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "5m"
              memory: "8Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
