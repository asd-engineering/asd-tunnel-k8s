# Dedicated ServiceAccount for tunnel pods.
# automountServiceAccountToken disabled — tunnel pods do not need K8s API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: asd-tunnel
  namespace: asd-tunnel-demo
  labels:
    app: asd-tunnel
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validation-server
  namespace: asd-tunnel-demo
  labels:
    app: validation-server
automountServiceAccountToken: false
