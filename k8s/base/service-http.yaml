# NodePort service exposing the HTTP muxer.
# Requests arrive here and are routed to the correct tunnel by Host header.
apiVersion: v1
kind: Service
metadata:
  name: asd-tunnel-http
  namespace: asd-tunnel-demo
  labels:
    app: asd-tunnel
spec:
  type: NodePort
  selector:
    app: asd-tunnel
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30080
      name: http
